<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments · ParkWise</title><link rel="stylesheet" href="css/app.css"></head><body><header></header><main><section id="payments"></section></main><script src="js/crud.js"></script><script>renderNav('payments.html');mountCrud(document.getElementById('payments'),{title:'Payment management',singular:'payment',description:'Record payments, track balances and manage installments.',api:'/api/part-payments',id:'paymentId',fields:[{name:'paymentId',label:'Payment ID',key:true,required:false,placeholder:'Auto-generated'},{name:'vehicleNumber',label:'Vehicle number',optionsFrom:{api:'/api/vehicles',value:'vehicleNumber',label:'vehicleNumber'}},{name:'customerName',label:'Customer name',placeholder:'Kamal Perera'},{name:'totalAmount',label:'Total amount (LKR)',type:'number',step:'0.01',min:0},{name:'paidAmount',label:'Paid amount (LKR)',type:'number',step:'0.01',min:0},{name:'paymentMethod',label:'Payment method',options:['CASH','CARD','BANK_TRANSFER','ONLINE']},{name:'notes',label:'Notes',required:false,wide:true,multiline:true}],columns:[{name:'paymentId',label:'Payment',mono:true},{name:'vehicleNumber',label:'Vehicle',mono:true},{name:'customerName',label:'Customer'},{name:'totalAmount',label:'Total',mono:true},{name:'paidAmount',label:'Paid',mono:true},{name:'balanceAmount',label:'Balance',mono:true},{name:'paymentMethod',label:'Method'},{name:'paymentStatus',label:'Status',chip:true},{name:'paymentDate',label:'Date',date:true}],actions:[{label:'Add installment',run:async(row,reload)=>{const v=prompt('Installment amount for '+row.paymentId);if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<=0)throw Error('Enter a valid amount greater than zero');await api('/api/part-payments/'+encodeURIComponent(row.paymentId)+'/installment',{method:'PATCH',body:JSON.stringify({additionalAmount:n})});toast('Installment recorded');await reload()}}]});</script></body></html>
