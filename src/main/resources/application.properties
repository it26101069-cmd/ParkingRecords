spring.application.name=parking

# MySQL: the "parking" database is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/parking?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Runs src/main/resources/schema.sql at startup to create all tables.
spring.sql.init.mode=always

server.port=8080
